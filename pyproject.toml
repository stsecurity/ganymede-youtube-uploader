[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ganymede-youtube-uploader"
version = "0.1.0"
description = "Upload completed Ganymede Twitch VOD archives to YouTube and clean up through Ganymede API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.2.1",
  "SQLAlchemy>=2.0.30",
  "httpx>=0.27.0",
  "google-api-python-client>=2.130.0",
  "google-auth-oauthlib>=1.2.0",
  "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.5.0",
]

[project.scripts]
ganymede-youtube-uploader = "ganymede_youtube_uploader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ganymede_youtube_uploader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

